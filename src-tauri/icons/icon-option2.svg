<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Option 2: ES-style flower with data elements -->
  <!-- Dark background -->
  <rect width="1024" height="1024" rx="200" fill="#1a1a2e"/>

  <!-- Central data visualization -->
  <g transform="translate(512, 512)">
    <!-- Multiple petals representing ES style -->
    <ellipse cx="0" cy="-180" rx="80" ry="140" fill="#FED10A" transform="rotate(0)"/>
    <ellipse cx="0" cy="-180" rx="80" ry="140" fill="#24BBB1" transform="rotate(72)"/>
    <ellipse cx="0" cy="-180" rx="80" ry="140" fill="#EF5098" transform="rotate(144)"/>
    <ellipse cx="0" cy="-180" rx="80" ry="140" fill="#1BA9F5" transform="rotate(216)"/>
    <ellipse cx="0" cy="-180" rx="80" ry="140" fill="#93C83E" transform="rotate(288)"/>

    <!-- Center circle with magnifying glass -->
    <circle cx="0" cy="0" r="120" fill="#1a1a2e"/>
    <circle cx="-30" cy="-30" r="50" stroke="white" stroke-width="16" fill="none"/>
    <line x1="10" y1="10" x2="60" y2="60" stroke="white" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>