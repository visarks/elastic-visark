<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Option 1: Magnifying glass with data bars -->
  <!-- Dark background -->
  <rect width="1024" height="1024" rx="200" fill="#1a1a2e"/>

  <!-- Magnifying glass -->
  <circle cx="420" cy="420" r="260" stroke="#FED10A" stroke-width="60" fill="none"/>
  <line x1="600" y1="600" x2="840" y2="840" stroke="#FED10A" stroke-width="60" stroke-linecap="round"/>

  <!-- Data bars inside -->
  <rect x="280" y="340" width="60" height="180" rx="20" fill="#FED10A"/>
  <rect x="360" y="280" width="60" height="240" rx="20" fill="#FED10A" opacity="0.85"/>
  <rect x="440" y="360" width="60" height="160" rx="20" fill="#FED10A" opacity="0.7"/>
</svg>