name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            arch: 'aarch64'
          - target: 'x86_64-apple-darwin'
            arch: 'x64'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Show generated files
        run: |
          echo "=== macOS bundle directory ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/macos/ || true
          echo "=== DMG directory ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/dmg/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - target: 'aarch64-pc-windows-msvc'
            arch: 'aarch64'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Show generated files
        shell: bash
        run: |
          echo "=== NSIS directory ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/nsis/ || true
          echo "=== MSI directory ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/msi/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Show generated files
        run: |
          echo "=== AppImage directory ==="
          ls -la src-tauri/target/release/bundle/appimage/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifact structure
        run: ls -R artifacts

      - name: Create update JSON files
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM="${VERSION#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Function to read signature (search recursively)
          get_signature() {
            local SIG_FILE=$(find "$1" -name "$2" 2>/dev/null | head -1)
            if [ -n "$SIG_FILE" ] && [ -f "$SIG_FILE" ]; then
              cat "$SIG_FILE" | tr -d '\n'
            else
              echo ""
            fi
          }

          # macOS x64 - use .app.tar.gz.sig
          MACOS_X64_SIG=$(get_signature "artifacts/macos-x64" "*.tar.gz.sig")
          cat > darwin-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-x86_64": {
                "signature": "${MACOS_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark_x64.app.tar.gz"
              }
            }
          }
          EOF

          # macOS aarch64
          MACOS_AARCH64_SIG=$(get_signature "artifacts/macos-aarch64" "*.tar.gz.sig")
          cat > darwin-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_AARCH64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark_aarch64.app.tar.gz"
              }
            }
          }
          EOF

          # Windows x64
          WINDOWS_X64_SIG=$(get_signature "artifacts/windows-x64" "*.exe.sig")
          cat > win32-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-x86_64": {
                "signature": "${WINDOWS_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark_x64-setup.exe"
              }
            }
          }
          EOF

          # Windows aarch64
          WINDOWS_AARCH64_SIG=$(get_signature "artifacts/windows-aarch64" "*.exe.sig")
          cat > win32-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-aarch64": {
                "signature": "${WINDOWS_AARCH64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark_aarch64-setup.exe"
              }
            }
          }
          EOF

          # Linux x64
          LINUX_X64_SIG=$(get_signature "artifacts/linux-x64" "*.AppImage.sig")
          cat > linux-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark_x64.AppImage"
              }
            }
          }
          EOF

          echo "Created update JSON files:"
          ls -la *-update.json

      - name: Rename artifacts for release
        run: |
          VERSION=${{ github.ref_name }}

          # macOS
          for arch in x64 aarch64; do
            # Find and rename .app.tar.gz (search recursively in artifact directory)
            tar_file=$(find artifacts/macos-${arch} -name "*.tar.gz" ! -name "*.sig" 2>/dev/null | head -1)
            if [ -n "$tar_file" ]; then
              mv "$tar_file" "elastic-visark_${arch}.app.tar.gz"
            fi
            # Find and rename .tar.gz.sig
            sig_file=$(find artifacts/macos-${arch} -name "*.tar.gz.sig" 2>/dev/null | head -1)
            if [ -n "$sig_file" ]; then
              mv "$sig_file" "elastic-visark_${arch}.app.tar.gz.sig"
            fi
            # Find and rename .dmg
            dmg_file=$(find artifacts/macos-${arch} -name "*.dmg" 2>/dev/null | head -1)
            if [ -n "$dmg_file" ]; then
              mv "$dmg_file" "elastic-visark_${arch}-${VERSION}.dmg"
            fi
          done

          # Windows
          for arch in x64 aarch64; do
            # Find and rename .exe (NSIS installer, not .sig)
            exe_file=$(find artifacts/windows-${arch} -name "*.exe" ! -name "*.sig" 2>/dev/null | head -1)
            if [ -n "$exe_file" ]; then
              mv "$exe_file" "elastic-visark_${arch}-setup.exe"
            fi
            # Find and rename .exe.sig
            exe_sig_file=$(find artifacts/windows-${arch} -name "*.exe.sig" 2>/dev/null | head -1)
            if [ -n "$exe_sig_file" ]; then
              mv "$exe_sig_file" "elastic-visark_${arch}-setup.exe.sig"
            fi
            # Find and rename .msi
            msi_file=$(find artifacts/windows-${arch} -name "*.msi" ! -name "*.sig" 2>/dev/null | head -1)
            if [ -n "$msi_file" ]; then
              mv "$msi_file" "elastic-visark_${arch}-${VERSION}.msi"
            fi
            # Find and rename .msi.sig
            msi_sig_file=$(find artifacts/windows-${arch} -name "*.msi.sig" 2>/dev/null | head -1)
            if [ -n "$msi_sig_file" ]; then
              mv "$msi_sig_file" "elastic-visark_${arch}-${VERSION}.msi.sig"
            fi
          done

          # Linux
          # Find and rename .AppImage
          appimage_file=$(find artifacts/linux-x64 -name "*.AppImage" ! -name "*.sig" 2>/dev/null | head -1)
          if [ -n "$appimage_file" ]; then
            mv "$appimage_file" "elastic-visark_x64.AppImage"
          fi
          # Find and rename .AppImage.sig
          appimage_sig_file=$(find artifacts/linux-x64 -name "*.AppImage.sig" 2>/dev/null | head -1)
          if [ -n "$appimage_sig_file" ]; then
            mv "$appimage_sig_file" "elastic-visark_x64.AppImage.sig"
          fi
          # Find and rename .deb
          deb_file=$(find artifacts/linux-x64 -name "*.deb" 2>/dev/null | head -1)
          if [ -n "$deb_file" ]; then
            mv "$deb_file" "elastic-visark_x64-${VERSION}.deb"
          fi
          # Find and rename .rpm
          rpm_file=$(find artifacts/linux-x64 -name "*.rpm" 2>/dev/null | head -1)
          if [ -n "$rpm_file" ]; then
            mv "$rpm_file" "elastic-visark_x64-${VERSION}.rpm"
          fi

          echo "Files for release:"
          ls -la *.tar.gz *.tar.gz.sig *.dmg *.exe *.exe.sig *.msi *.msi.sig *.AppImage *.AppImage.sig *.deb *.rpm *-update.json 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sig
            *.dmg
            *.exe
            *.exe.sig
            *.msi
            *.msi.sig
            *.AppImage
            *.AppImage.sig
            *.deb
            *.rpm
            *-update.json
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}