name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            arch: 'aarch64'
          - target: 'x86_64-apple-darwin'
            arch: 'x64'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Rename artifacts
        run: |
          VERSION=${{ github.ref_name }}
          # DMG
          cd src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          for f in *.dmg; do
            mv "$f" "elastic-search-macos-${{ matrix.arch }}-${VERSION}.dmg"
          done
          # macOS app bundle for pkg
          cd ../macos
          if [ -d "*.app" ]; then
            APP_NAME=$(ls -d *.app | head -1)
            # Create pkg
            pkgbuild --root . --identifier com.elastic.search --version "${VERSION#v}" --install-location /Applications "elastic-search-macos-${{ matrix.arch }}-${VERSION}.pkg"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.pkg

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - target: 'aarch64-pc-windows-msvc'
            arch: 'aarch64'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          # NSIS (exe)
          cd src-tauri/target/${{ matrix.target }}/release/bundle/nsis
          for f in *.exe; do
            mv "$f" "elastic-search-windows-${{ matrix.arch }}-${VERSION}-setup.exe"
          done
          # MSI
          cd ../msi
          for f in *.msi; do
            mv "$f" "elastic-search-windows-${{ matrix.arch }}-${VERSION}.msi"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build

      - name: Rename packages
        run: |
          VERSION=${{ github.ref_name }}
          # DEB
          cd src-tauri/target/release/bundle/deb
          for f in *.deb; do
            mv "$f" "elastic-search-linux-x64-${VERSION}.deb"
          done
          # RPM
          cd ../rpm
          for f in *.rpm; do
            mv "$f" "elastic-search-linux-x64-${VERSION}.rpm"
          done
          # AppImage
          cd ../appimage
          for f in *.AppImage; do
            mv "$f" "elastic-search-linux-x64-${VERSION}.AppImage"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create update JSON files
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM="${VERSION#v}"

          # Get current date in ISO format
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Create update JSON for macOS aarch64
          cat > darwin-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-search-macos-aarch64-${VERSION}.dmg"
              }
            }
          }
          EOF

          # Create update JSON for macOS x64
          cat > darwin-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-x86_64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-search-macos-x64-${VERSION}.dmg"
              }
            }
          }
          EOF

          # Create update JSON for Windows x64
          cat > win32-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-x86_64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-search-windows-x64-${VERSION}-setup.exe"
              }
            }
          }
          EOF

          # Create update JSON for Windows aarch64
          cat > win32-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-aarch64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-search-windows-aarch64-${VERSION}-setup.exe"
              }
            }
          }
          EOF

          # Create update JSON for Linux x64
          cat > linux-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "linux-x86_64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-search-linux-x64-${VERSION}.AppImage"
              }
            }
          }
          EOF

          echo "Created update JSON files:"
          ls -la *-update.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            *-update.json
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}