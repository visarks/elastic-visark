name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            arch: 'aarch64'
          - target: 'x86_64-apple-darwin'
            arch: 'x64'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts and collect signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=${{ github.ref_name }}
          ARCH=${{ matrix.arch }}

          # Write private key to temp file for signing
          echo "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/private.key

          # Unset env var to avoid conflict with --private-key-path
          unset TAURI_SIGNING_PRIVATE_KEY

          # DMG
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          cd "$DMG_DIR"
          for f in *.dmg; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-macos-${ARCH}-${VERSION}.dmg"
              # Sign the DMG
              if [ -s /tmp/private.key ]; then
                echo "Signing DMG: elastic-visark-macos-${ARCH}-${VERSION}.dmg"
                pnpm tauri signer sign --private-key-path /tmp/private.key "elastic-visark-macos-${ARCH}-${VERSION}.dmg" || echo "Signing failed"
              fi
            fi
          done
          cd -

          # Create signatures directory
          mkdir -p signatures

          # Copy signature files if they exist
          find "$DMG_DIR" -name "*.sig" -exec cp {} signatures/ \; 2>/dev/null || true

          # Also check for .sig files from tauri build
          find src-tauri/target -name "*.sig" -exec cp {} signatures/ \; 2>/dev/null || true

          # Clean up private key
          rm -f /tmp/private.key

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.pkg
            signatures/*.sig

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - target: 'aarch64-pc-windows-msvc'
            arch: 'aarch64'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          ARCH=${{ matrix.arch }}

          # NSIS (exe)
          NSIS_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          cd "$NSIS_DIR"
          for f in *.exe; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-windows-${ARCH}-${VERSION}-setup.exe"
            fi
          done
          cd -

          # MSI
          MSI_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/msi"
          cd "$MSI_DIR"
          for f in *.msi; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-windows-${ARCH}-${VERSION}.msi"
            fi
          done
          cd -

          # Create signatures directory
          mkdir -p signatures

          # Copy signature files from tauri build
          find src-tauri/target -name "*.sig" -exec cp {} signatures/ \; 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            signatures/*.sig

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename packages
        run: |
          VERSION=${{ github.ref_name }}

          # DEB
          cd src-tauri/target/release/bundle/deb
          for f in *.deb; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-linux-x64-${VERSION}.deb"
            fi
          done
          cd -

          # RPM
          cd src-tauri/target/release/bundle/rpm
          for f in *.rpm; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-linux-x64-${VERSION}.rpm"
            fi
          done
          cd -

          # AppImage
          cd src-tauri/target/release/bundle/appimage
          for f in *.AppImage; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-linux-x64-${VERSION}.AppImage"
            fi
          done
          cd -

          # Create signatures directory
          mkdir -p signatures

          # Copy signature files from tauri build
          find src-tauri/target -name "*.sig" -exec cp {} signatures/ \; 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            signatures/*.sig

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Install pnpm for signer
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Create update JSON files with signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM="${VERSION#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Write private key to temp file
          echo "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/private.key

          # Unset env var to avoid conflict with --private-key-path
          unset TAURI_SIGNING_PRIVATE_KEY

          # Debug: check if key file exists and has content
          echo "Private key file size: $(wc -c < /tmp/private.key) bytes"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set: $([ -n \"$TAURI_SIGNING_PRIVATE_KEY_PASSWORD\" ] && echo 'yes' || echo 'no')"

          # Function to get signature for a file
          get_signature() {
            local FILE_PATH="$1"
            if [ -f "$FILE_PATH" ] && [ -s /tmp/private.key ]; then
              # Sign the file and extract the public signature
              echo "Signing: $FILE_PATH" >&2
              pnpm tauri signer sign --private-key-path /tmp/private.key "$FILE_PATH" 2>&1 | grep -A1 "Public signature:" | tail -1
            else
              echo "File not found or key empty: $FILE_PATH" >&2
              echo ""
            fi
          }

          # macOS aarch64
          MACOS_AARCH64_DMG="artifacts/macos-aarch64/elastic-visark-macos-aarch64-${VERSION}.dmg"
          MACOS_AARCH64_SIG=$(get_signature "$MACOS_AARCH64_DMG")
          cat > darwin-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_AARCH64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-macos-aarch64-${VERSION}.dmg"
              }
            }
          }
          EOF

          # macOS x64
          MACOS_X64_DMG="artifacts/macos-x64/elastic-visark-macos-x64-${VERSION}.dmg"
          MACOS_X64_SIG=$(get_signature "$MACOS_X64_DMG")
          cat > darwin-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-x86_64": {
                "signature": "${MACOS_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-macos-x64-${VERSION}.dmg"
              }
            }
          }
          EOF

          # Windows x64
          WINDOWS_X64_EXE="artifacts/windows-x64/elastic-visark-windows-x64-${VERSION}-setup.exe"
          WINDOWS_X64_SIG=$(get_signature "$WINDOWS_X64_EXE")
          cat > win32-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-x86_64": {
                "signature": "${WINDOWS_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-windows-x64-${VERSION}-setup.exe"
              }
            }
          }
          EOF

          # Windows aarch64
          WINDOWS_AARCH64_EXE="artifacts/windows-aarch64/elastic-visark-windows-aarch64-${VERSION}-setup.exe"
          WINDOWS_AARCH64_SIG=$(get_signature "$WINDOWS_AARCH64_EXE")
          cat > win32-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-aarch64": {
                "signature": "${WINDOWS_AARCH64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-windows-aarch64-${VERSION}-setup.exe"
              }
            }
          }
          EOF

          # Linux x64
          LINUX_X64_APPIMAGE="artifacts/linux-x64/elastic-visark-linux-x64-${VERSION}.AppImage"
          LINUX_X64_SIG=$(get_signature "$LINUX_X64_APPIMAGE")
          cat > linux-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-linux-x64-${VERSION}.AppImage"
              }
            }
          }
          EOF

          echo "Created update JSON files:"
          ls -la *-update.json
          echo ""
          echo "Contents of darwin-x86_64-update.json:"
          cat darwin-x86_64-update.json

          # Clean up private key
          rm -f /tmp/private.key

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            *-update.json
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}