name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            arch: 'aarch64'
          - target: 'x86_64-apple-darwin'
            arch: 'x64'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts and collect signatures
        run: |
          VERSION=${{ github.ref_name }}
          ARCH=${{ matrix.arch }}

          printf '%s' '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}' > /tmp/private.key
          DMG_DIR="$(pwd)/src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          echo "DMG directory: $DMG_DIR"

          for f in "$DMG_DIR"/*.dmg; do
            if [ -f "$f" ]; then
              NEW_NAME="elastic-visark-macos-${ARCH}-${VERSION}.dmg"
              NEW_PATH="$DMG_DIR/$NEW_NAME"
              echo "Renaming $(basename "$f") to $NEW_NAME"
              mv "$f" "$NEW_PATH"

              # Sign DMG - generates $NEW_PATH.sig automatically
              if [ -s /tmp/private.key ]; then
                echo "Signing DMG: $NEW_PATH"
                TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" \
                pnpm tauri signer sign --private-key-path /tmp/private.key "$NEW_PATH"
                
                # Rename the auto-generated .sig file
                if [ -f "$NEW_PATH.sig" ]; then
                  mv "$NEW_PATH.sig" "$DMG_DIR/elastic-visark-macos-${ARCH}-${VERSION}.sig"
                  echo "✓ Signature file created: elastic-visark-macos-${ARCH}-${VERSION}.sig"
                else
                  echo "ERROR: .sig file not found after signing!" >&2
                  exit 1
                fi
              fi
            fi
          done

          echo "Final DMG directory contents:"
          ls -la "$DMG_DIR"
          rm -f /tmp/private.key

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sig  # CRITICAL: Upload .sig not .signature
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.pkg
          if-no-files-found: warn

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - target: 'aarch64-pc-windows-msvc'
            arch: 'aarch64'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          ARCH=${{ matrix.arch }}

          # NSIS (exe)
          NSIS_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          cd "$NSIS_DIR"
          for f in *.exe; do
            [ -f "$f" ] && mv "$f" "elastic-visark-windows-${ARCH}-${VERSION}-setup.exe"
          done
          cd -

          # MSI
          MSI_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/msi"
          cd "$MSI_DIR"
          for f in *.msi; do
            [ -f "$f" ] && mv "$f" "elastic-visark-windows-${ARCH}-${VERSION}.msi"
          done
          cd -

          # Copy .sig files to signatures directory
          mkdir -p signatures
          find src-tauri/target -name "*.sig" -exec cp {} signatures/ \; 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            signatures/*.sig

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename packages
        run: |
          VERSION=${{ github.ref_name }}

          cd src-tauri/target/release/bundle/deb && \
            for f in *.deb; do [ -f "$f" ] && mv "$f" "elastic-visark-linux-x64-${VERSION}.deb"; done && cd -
          
          cd src-tauri/target/release/bundle/rpm && \
            for f in *.rpm; do [ -f "$f" ] && mv "$f" "elastic-visark-linux-x64-${VERSION}.rpm"; done && cd -
          
          cd src-tauri/target/release/bundle/appimage && \
            for f in *.AppImage; do [ -f "$f" ] && mv "$f" "elastic-visark-linux-x64-${VERSION}.AppImage"; done && cd -

          mkdir -p signatures
          find src-tauri/target -name "*.sig" -exec cp {} signatures/ \; 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            signatures/*.sig

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create update JSON files with signatures
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM="${VERSION#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read pure base64 signature from .sig file (remove newlines)
          get_signature() {
            local SIG_FILE="$1"
            if [ -f "$SIG_FILE" ]; then
              cat "$SIG_FILE" | tr -d '\n'
            else
              echo "WARNING: Signature file missing: $SIG_FILE" >&2
              echo ""
            fi
          }

          # macOS x64
          MACOS_X64_SIG=$(get_signature "artifacts/macos-x64/elastic-visark-macos-x64-${VERSION}.sig")
          echo "macOS x64 signature length: ${#MACOS_X64_SIG}"
          cat > darwin-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-x86_64": {
                "signature": "${MACOS_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-macos-x64-${VERSION}.dmg"
              }
            }
          }
          EOF

          # macOS aarch64
          MACOS_AARCH64_SIG=$(get_signature "artifacts/macos-aarch64/elastic-visark-macos-aarch64-${VERSION}.sig")
          echo "macOS aarch64 signature length: ${#MACOS_AARCH64_SIG}"
          cat > darwin-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_AARCH64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-macos-aarch64-${VERSION}.dmg"
              }
            }
          }
          EOF

          # Windows x64 (add signature if needed later)
          cat > win32-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-x86_64": {
                "signature": "",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-windows-x64-${VERSION}-setup.exe"
              }
            }
          }
          EOF

          # Windows aarch64
          cat > win32-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-aarch64": {
                "signature": "",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-windows-aarch64-${VERSION}-setup.exe"
              }
            }
          }
          EOF

          # Linux x64
          cat > linux-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-linux-x64-${VERSION}.AppImage"
              }
            }
          }
          EOF

          echo "✅ Created update JSON files:"
          ls -la *-update.json
          echo -e "\n🔍 Sample signature content (first 100 chars):"
          echo "${MACOS_X64_SIG}" | cut -c1-100

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            *-update.json
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
