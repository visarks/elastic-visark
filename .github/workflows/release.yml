name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            arch: 'aarch64'
          - target: 'x86_64-apple-darwin'
            arch: 'x64'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: |
          echo "$TAURI_SIGNING_PRIVATE_KEY" > secret_key.b64
          base64 -d -i secret_key.b64 -o signing_key.key
          export TAURI_SIGNING_PRIVATE_KEY="$(cat signing_key.key)"
          unset TAURI_SIGNING_PRIVATE_KEY_FILE
          pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Show generated files
        run: |
          echo "=== macOS bundle directory ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/macos/ || true
          echo "=== DMG directory ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/dmg/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - target: 'aarch64-pc-windows-msvc'
            arch: 'aarch64'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: |
          echo "$TAURI_SIGNING_PRIVATE_KEY" > secret_key.b64
          base64 -d -i secret_key.b64 -o signing_key.key
          export TAURI_SIGNING_PRIVATE_KEY="$(cat signing_key.key)"
          unset TAURI_SIGNING_PRIVATE_KEY_FILE
          pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Show generated files
        shell: bash
        run: |
          echo "=== NSIS directory ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/nsis/ || true
          echo "=== MSI directory ==="
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/msi/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: |
          echo "$TAURI_SIGNING_PRIVATE_KEY" > secret_key.b64
          base64 -d -i secret_key.b64 -o signing_key.key
          export TAURI_SIGNING_PRIVATE_KEY="$(cat signing_key.key)"
          unset TAURI_SIGNING_PRIVATE_KEY_FILE
          pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Show generated files
        run: |
          echo "=== AppImage directory ==="
          ls -la src-tauri/target/release/bundle/appimage/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifact structure
        run: ls -R artifacts

      - name: Create update JSON files
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM="${VERSION#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Function to get filename
          get_filename() {
            local FILE=$(find "$1" -name "$2" ! -name "*.sig" 2>/dev/null | head -1)
            if [ -n "$FILE" ]; then
              basename "$FILE"
            else
              echo ""
            fi
          }

          # Function to get signature content
          get_signature() {
            local SIG=$(find "$1" -name "$2.sig" 2>/dev/null | head -1)
            if [ -n "$SIG" ]; then
              cat "$SIG"
            else
              echo ""
            fi
          }

          # macOS x64
          MACOS_X64_URL=$(get_filename "artifacts/macos-x64" "*.tar.gz")
          MACOS_X64_SIG=$(get_signature "artifacts/macos-x64" "*.tar.gz")
          cat > darwin-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-x86_64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/${MACOS_X64_URL}",
                "signature": "${MACOS_X64_SIG}"
              }
            }
          }
          EOF

          # macOS aarch64
          MACOS_AARCH64_URL=$(get_filename "artifacts/macos-aarch64" "*.tar.gz")
          MACOS_AARCH64_SIG=$(get_signature "artifacts/macos-aarch64" "*.tar.gz")
          cat > darwin-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/${MACOS_AARCH64_URL}",
                "signature": "${MACOS_AARCH64_SIG}"
              }
            }
          }
          EOF

          # Windows x64
          WINDOWS_X64_URL=$(get_filename "artifacts/windows-x64" "*.exe")
          WINDOWS_X64_SIG=$(get_signature "artifacts/windows-x64" "*.exe")
          cat > win32-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-x86_64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/${WINDOWS_X64_URL}",
                "signature": "${WINDOWS_X64_SIG}"
              }
            }
          }
          EOF

          # Windows aarch64
          WINDOWS_AARCH64_URL=$(get_filename "artifacts/windows-aarch64" "*.exe")
          WINDOWS_AARCH64_SIG=$(get_signature "artifacts/windows-aarch64" "*.exe")
          cat > win32-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-aarch64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/${WINDOWS_AARCH64_URL}",
                "signature": "${WINDOWS_AARCH64_SIG}"
              }
            }
          }
          EOF

          # Linux x64
          LINUX_X64_URL=$(get_filename "artifacts/linux-x64" "*.AppImage")
          LINUX_X64_SIG=$(get_signature "artifacts/linux-x64" "*.AppImage")
          cat > linux-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "linux-x86_64": {
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/${LINUX_X64_URL}",
                "signature": "${LINUX_X64_SIG}"
              }
            }
          }
          EOF

          echo "Created update JSON files:"
          ls -la *-update.json

      - name: Prepare release files
        run: |
          # Move all files to root for release
          # macOS
          for arch in x64 aarch64; do
            find artifacts/macos-${arch} -name "*.tar.gz" -exec mv {} . \; 2>/dev/null || true
            find artifacts/macos-${arch} -name "*.dmg" -exec mv {} . \; 2>/dev/null || true
            find artifacts/macos-${arch} -name "*.tar.gz.sig" -exec mv {} . \; 2>/dev/null || true
          done

          # Windows
          for arch in x64 aarch64; do
            find artifacts/windows-${arch} -name "*.exe" -exec mv {} . \; 2>/dev/null || true
            find artifacts/windows-${arch} -name "*.msi" -exec mv {} . \; 2>/dev/null || true
            find artifacts/windows-${arch} -name "*.exe.sig" -exec mv {} . \; 2>/dev/null || true
            find artifacts/windows-${arch} -name "*.msi.sig" -exec mv {} . \; 2>/dev/null || true
          done

          # Linux
          find artifacts/linux-x64 -name "*.AppImage" -exec mv {} . \; 2>/dev/null || true
          find artifacts/linux-x64 -name "*.deb" -exec mv {} . \; 2>/dev/null || true
          find artifacts/linux-x64 -name "*.rpm" -exec mv {} . \; 2>/dev/null || true
          find artifacts/linux-x64 -name "*.AppImage.sig" -exec mv {} . \; 2>/dev/null || true

          echo "Files for release:"
          ls -la *.tar.gz *.dmg *.exe *.msi *.AppImage *.deb *.rpm *.sig *-update.json 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.dmg
            *.exe
            *.msi
            *.AppImage
            *.deb
            *.rpm
            *.sig
            *-update.json
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}