name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            arch: 'aarch64'
          - target: 'x86_64-apple-darwin'
            arch: 'x64'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts and collect signatures
        run: |
          VERSION=${{ github.ref_name }}
          ARCH=${{ matrix.arch }}

          # Write private key to temp file for signing (no newline)
          printf '%s' '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}' > /tmp/private.key

          # DMG
          DMG_DIR="$(pwd)/src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          echo "DMG directory: $DMG_DIR"
          ls -la "$DMG_DIR" || echo "DMG directory not found"

          for f in "$DMG_DIR"/*.dmg; do
            if [ -f "$f" ]; then
              BASENAME=$(basename "$f")
              NEW_NAME="elastic-visark-macos-${ARCH}-${VERSION}.dmg"
              NEW_PATH="$DMG_DIR/$NEW_NAME"
              echo "Renaming $BASENAME to $NEW_NAME"
              mv "$f" "$NEW_PATH"
              # Sign the DMG
              if [ -s /tmp/private.key ]; then
                echo "Signing DMG: $NEW_PATH"
                TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" pnpm tauri signer sign --private-key-path /tmp/private.key "$NEW_PATH"
                echo "Signature file generated:"
                ls -la "$NEW_PATH.sig" || echo "Signature file not found"
              fi
            fi
          done

          # Show final directory contents
          echo "Final DMG directory contents:"
          ls -la "$DMG_DIR"

          # Clean up private key
          rm -f /tmp/private.key

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/elastic-visark-macos-${{ matrix.arch }}-${{ github.ref_name }}.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/elastic-visark-macos-${{ matrix.arch }}-${{ github.ref_name }}.dmg.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.pkg

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86_64-pc-windows-msvc'
            arch: 'x64'
          - target: 'aarch64-pc-windows-msvc'
            arch: 'aarch64'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          ARCH=${{ matrix.arch }}

          # NSIS (exe)
          NSIS_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          cd "$NSIS_DIR"
          for f in *.exe; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-windows-${ARCH}-${VERSION}-setup.exe"
            fi
          done
          cd -

          # MSI
          MSI_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/msi"
          cd "$MSI_DIR"
          for f in *.msi; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-windows-${ARCH}-${VERSION}.msi"
            fi
          done
          cd -

          # Create signatures directory
          mkdir -p signatures

          # Copy signature files from tauri build
          find src-tauri/target -name "*.sig" -exec cp {} signatures/ \; 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            signatures/*.sig

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename packages
        run: |
          VERSION=${{ github.ref_name }}

          # DEB
          cd src-tauri/target/release/bundle/deb
          for f in *.deb; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-linux-x64-${VERSION}.deb"
            fi
          done
          cd -

          # RPM
          cd src-tauri/target/release/bundle/rpm
          for f in *.rpm; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-linux-x64-${VERSION}.rpm"
            fi
          done
          cd -

          # AppImage
          cd src-tauri/target/release/bundle/appimage
          for f in *.AppImage; do
            if [ -f "$f" ]; then
              mv "$f" "elastic-visark-linux-x64-${VERSION}.AppImage"
            fi
          done
          cd -

          # Create signatures directory
          mkdir -p signatures

          # Copy signature files from tauri build
          find src-tauri/target -name "*.sig" -exec cp {} signatures/ \; 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            signatures/*.sig

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create update JSON files with signatures
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM="${VERSION#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Debug: show artifact structure
          echo "Artifacts structure:"
          find artifacts -type f -name "*.sig" -o -name "*.dmg" | head -20
          echo "---"
          ls -R artifacts

          # Function to read signature from .sig file
          get_signature() {
            local FILE_PATH="$1"
            local SIG_FILE="${FILE_PATH}.sig"
            echo "Looking for signature file: $SIG_FILE"
            if [ -f "$SIG_FILE" ]; then
              echo "Found signature file, content:"
              cat "$SIG_FILE"
            else
              echo "Signature file not found!"
              # Try to find any .sig file in the same directory
              local DIR=$(dirname "$FILE_PATH")
              echo "Looking for .sig files in $DIR:"
              ls -la "$DIR"/*.sig 2>/dev/null || echo "No .sig files in directory"
            fi
          }

          # macOS x64
          MACOS_X64_DMG="artifacts/macos-x64/elastic-visark-macos-x64-${VERSION}.dmg"
          echo "Looking for DMG: $MACOS_X64_DMG"
          ls -la "$MACOS_X64_DMG" || echo "DMG not found"
          MACOS_X64_SIG=$(get_signature "$MACOS_X64_DMG")
          echo "macOS x64 signature: $MACOS_X64_SIG"
          cat > darwin-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-x86_64": {
                "signature": "${MACOS_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-macos-x64-${VERSION}.dmg"
              }
            }
          }
          EOF

          # macOS aarch64
          MACOS_AARCH64_DMG="artifacts/macos-aarch64/elastic-visark-macos-aarch64-${VERSION}.dmg"
          MACOS_AARCH64_SIG=$(get_signature "$MACOS_AARCH64_DMG")
          cat > darwin-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_AARCH64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-macos-aarch64-${VERSION}.dmg"
              }
            }
          }
          EOF

          # Windows x64
          WINDOWS_X64_EXE="artifacts/windows-x64/elastic-visark-windows-x64-${VERSION}-setup.exe"
          WINDOWS_X64_SIG=$(get_signature "$WINDOWS_X64_EXE")
          cat > win32-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-x86_64": {
                "signature": "${WINDOWS_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-windows-x64-${VERSION}-setup.exe"
              }
            }
          }
          EOF

          # Windows aarch64
          WINDOWS_AARCH64_EXE="artifacts/windows-aarch64/elastic-visark-windows-aarch64-${VERSION}-setup.exe"
          WINDOWS_AARCH64_SIG=$(get_signature "$WINDOWS_AARCH64_EXE")
          cat > win32-aarch64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "win32-aarch64": {
                "signature": "${WINDOWS_AARCH64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-windows-aarch64-${VERSION}-setup.exe"
              }
            }
          }
          EOF

          # Linux x64
          LINUX_X64_APPIMAGE="artifacts/linux-x64/elastic-visark-linux-x64-${VERSION}.AppImage"
          LINUX_X64_SIG=$(get_signature "$LINUX_X64_APPIMAGE")
          cat > linux-x86_64-update.json << EOF
          {
            "version": "${VERSION_NUM}",
            "date": "${DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_X64_SIG}",
                "url": "https://github.com/visarks/elastic-visark/releases/download/${VERSION}/elastic-visark-linux-x64-${VERSION}.AppImage"
              }
            }
          }
          EOF

          echo "Created update JSON files:"
          ls -la *-update.json
          echo ""
          echo "Contents of darwin-x86_64-update.json:"
          cat darwin-x86_64-update.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            *-update.json
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}